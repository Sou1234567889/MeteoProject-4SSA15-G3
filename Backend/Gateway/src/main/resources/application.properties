spring.application.name=Gateway
server.port=8085

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Route 1 : MeteoService
spring.cloud.gateway.server.webflux.routes[0].id=meteo-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://METEOSERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/meteo/**,/api/previsions/**,/api/historiques/**

# Route 2 : Localisation
spring.cloud.gateway.server.webflux.routes[1].id=localisation-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://LOCALISATION
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/pays/**,/api/regions/**
