
# Configuration du microservice
spring.application.name=MeteoService
server.port=8082

# MongoDB
spring.data.mongodb.uri=mongodb://127.0.0.1:27017/meteodb

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Spring Boot Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Eureka Health Check
eureka.client.healthcheck.enabled=true

# Informations du microservice
management.info.env.enabled=true
info.app.name=MeteoService
info.app.version=1.0.0
info.app.description=Microservice de gestion meteorologique
info.app.team=4SSA15-G3
