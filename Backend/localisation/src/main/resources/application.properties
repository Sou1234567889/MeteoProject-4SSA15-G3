# Service
spring.application.name=localisation
server.port=8100

# Postgres
spring.datasource.url=jdbc:postgresql://localhost:5432/localisation_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Eureka registration
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Logs
logging.level.org.hibernate.SQL=DEBUG
logging.level.tn.esprit.localisation=INFO

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,loggers

# Show component details in /health (db, diskSpace, ping...)
management.endpoint.health.show-details=always

# Publish info.* properties in /actuator/info
management.info.env.enabled=true
info.app.name=localisation
info.app.version=1.0.0
info.app.description=Microservice de gestion des localisations
info.app.team=4SSA15-G3

# --- Eureka ---
# Send the real /health status to Eureka
eureka.client.healthcheck.enabled=true

# Optional, for a faster demo (default heartbeat is 30s)
eureka.instance.lease-renewal-interval-in-seconds=5